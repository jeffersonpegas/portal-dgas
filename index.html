ste Fluminense", "id": "p5_0"}, {"name": "Itaperuna", "unit": "21º GBM", "region": "Norte e Noroeste Fluminense", "id": "p5_1"}, {"name": "São Fidélis", "unit": "DBM 2/5", "region": "Norte e Noroeste Fluminense", "id": "p5_2"}],regions=["Capital e Especializado", "Metropolitano", "Baixada Fluminense e Região Serrana", "Sul Fluminense e Costa Verde", "Baixada Litorânea", "Norte e Noroeste Fluminense"],projects=["Preparação para Reserva (PPR)", "Projeto ELAS — Mulheres que servem", "Atenção à Pessoa com Deficiência", "Valorização da Vida (PVV)", "Resgatando Memórias", "AproxiMar", "Educação Financeira", "Conversando com a Tropa", "Serviço Social Itinerante"];
const app=document.getElementById('app');let page='inicio',selectedRegion='',search='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pin=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 57s20-19 20-34a20 20 0 0 0-40 0c0 15 20 34 20 34Z"/><circle cx="32" cy="23" r="8"/></svg>`;
function go(p){page=p;search='';selectedRegion='';render();window.scrollTo({top:0,behavior:'instant'})}window.go=go;
function banner(title,desc){return `<section class="pagebanner"><div class="crumb">PÁGINA INICIAL / ${esc(title.toUpperCase())}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='inicio'){app.innerHTML=`<section class="hero"><img alt="Capa DGAS com mapa em malha do Estado do Rio de Janeiro" src="capa-dgas.png"><button class="hotspot" aria-label="Conheça nossos polos" title="Conheça nossos polos" onclick="go('polos')"></button></section><section class="intro"><h2>Conheça a DGAS</h2><div class="featuregrid">${[['Nossos polos','23 polos fixos em seis núcleos regionais','polos'],['Projetos e programas','Iniciativas de assistência social','projetos'],['Serviços','Acolhimento e orientação','servicos'],['Ações e resultados','Atividades institucionais','acoes']].map(a=>`<button class="feature" onclick="go('${a[2]}')"><strong>${a[0]} →</strong><span>${a[1]}</span></button>`).join('')}</div></section>`;return}if(page==='polos'){app.innerHTML=banner('Nossos polos','23 polos fixos distribuídos em seis núcleos regionais do Estado do Rio de Janeiro')+`<div class="layout"><aside class="sidebar"><h2>⚲ FILTROS</h2><div class="filterlabel">Núcleos regionais</div><label><input type="radio" name="reg" value="" checked> Todas as regiões</label>${regions.map(r=>`<label><input type="radio" name="reg" value="${esc(r)}"> ${esc(r)}</label>`).join('')}</aside><section><div class="searchrow"><input id="search" type="search" placeholder="Pesquise por polo ou município" aria-label="Pesquisar polo ou município"><button id="searchbtn">Buscar</button></div><div id="count" class="count" aria-live="polite"></div><div id="catalog" class="catalog"></div></section></div>`;document.querySelectorAll('input[name=reg]').forEach(e=>e.addEventListener('change',()=>{selectedRegion=e.value;drawCatalog()}));document.getElementById('search').addEventListener('input',e=>{search=e.target.value;drawCatalog()});document.getElementById('searchbtn').addEventListener('click',()=>drawCatalog());drawCatalog();return}if(page.startsWith('polo/')){const p=polos.find(x=>x.id===page.slice(5));if(!p)return go('polos');app.innerHTML=banner(p.name,p.region)+`<article class="detail"><button class="back" onclick="go('polos')">← Voltar aos polos</button><div class="panel"><span class="tag">Polo fixo</span><h2>${esc(p.name)}</h2><p><strong>Unidade de referência:</strong> ${esc(p.unit)}</p><p><strong>Núcleo regional:</strong> ${esc(p.region)}</p></div><div class="panel"><h2>Atendimento e localização</h2><p>Endereço, telefone, horários de atendimento e fotografias aguardam confirmação institucional.</p></div><div class="panel"><h2>Serviços e projetos vinculados</h2><p>Informações a serem preenchidas após validação do portfólio e da atuação local.</p><button class="primary" onclick="go('projetos')">Conheça os projetos</button></div></article>`;return}if(page==='projetos'){app.innerHTML=banner('Projetos e programas','Conheça as iniciativas da Diretoria-Geral de Assistência Social')+`<section class="intro"><h2>Programas estruturantes</h2><div class="featuregrid"><button class="feature" onclick="go('projeto/qualidade')"><strong>Qualidade de Vida do Bombeiro Militar</strong><span>Programa institucional</span></button><button class="feature" onclick="go('projeto/descentralizacao')"><strong>Descentralização do Serviço Social</strong><span>Programa institucional</span></button></div><h2 style="margin-top:50px">Projetos</h2><div class="projectgrid">${projects.map((p,i)=>`<button class="projectcard ${i===0?'ppr-card':i===1?'elas-card':i===2?'papcd-card':i===3?'pv-card':i===4?'mem-card':i===6?'fin-card':i===7?'tropa-card':i===8?'itinerante-card':''}" onclick="go('projeto/${i}')">${i===0?`<img class="ppr-cover" src="logo-card-ppr.png" alt="Identidade visual do Programa de Preparação para a Reserva">` :i===1?`<img class="elas-cover" src="logo-card-elas.png" alt="Identidade visual do Projeto ELAS">`:i===2?`<img class="papcd-cover" src="logo-card-papcd.png" alt="Identidade visual do Programa de Atenção à Pessoa com Deficiência">` :i===3?`<img class="pv-cover" src="logo-card-pvv.png" alt="Identidade visual do Programa de Valorização da Vida">`:i===4?`<img class="mem-cover" src="logo-card-memorias.png" alt="Identidade visual do Projeto Resgatando Memórias">`:i===5?`<img class="aprox-cover" src="logo-card-aproximar.png" alt="Identidade visual do Projeto AproxiMar">`:i===6?`<img class="fin-cover" src="logo-card-financeira.png" alt="Identidade visual do Projeto Educação Financeira">` :i===8?`<img class="itinerante-cover" src="logo-card-itinerante.png" alt="Identidade visual do Projeto Serviço Social Itinerante">`:i===7?`<img class="tropa-cover" src="logo-card-tropa.png" alt="Identidade visual do Projeto Conversando com a Tropa">`:`<div class="circle">${pin}</div>`}<strong>${esc(p)}</strong><span class="notice">Conheça a iniciativa →</span></button>`).join('')}</div></section>`;return}if(page.startsWith('projeto/')){const k=page.split('/')[1],name=k==='qualidade'?'Qualidade de Vida do Bombeiro Militar':k==='descentralizacao'?'Descentralização do Serviço Social':projects[Number(k)]||'Projeto';if(k==='1'){app.innerHTML=banner('Projeto ELAS','Mulheres que servem. Histórias que importam.')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="elas-detail-cover" src="capa-projeto-elas.jpeg" alt="Identidade visual do Projeto ELAS"><h2>Projeto ELAS</h2><p class="ppr-lead">Valorização, acolhimento e cuidado com as mulheres do CBMERJ.</p><p class="ppr-text">O Projeto ELAS, desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo promover o bem-estar, a saúde integral e a qualidade de vida das mulheres bombeiras militares, reconhecendo suas particularidades, trajetórias e contribuições para a Corporação.</p><p class="ppr-text">Por meio de ações preventivas, socioeducativas e interdisciplinares, o projeto proporciona espaços de acolhimento, escuta qualificada, orientação e troca de experiências, abordando temas relacionados à saúde física e emocional, aos direitos das mulheres, à valorização profissional, às relações interpessoais e à prevenção de situações de violência e discriminação.</p><p class="ppr-text">A iniciativa também busca fortalecer as redes de apoio, estimular a autonomia e ampliar o acesso à informação e aos serviços de proteção e cuidado, contribuindo para o enfrentamento de desafios vivenciados pelas mulheres no ambiente institucional e na vida pessoal e familiar.</p><p class="ppr-text">Ao incentivar o diálogo, o respeito às diferenças e a construção de relações mais saudáveis, o ELAS reafirma o compromisso da DGAS com um ambiente institucional inclusivo, acolhedor e comprometido com a dignidade e a valorização das mulheres que integram o CBMERJ.</p><p><strong>Projeto ELAS — Mulheres que servem. Histórias que importam.</strong></p></div><div class="panel"><h2>Galeria de atividades</h2><div class="gallery"><figure><img src="elas-atividade-01.jpeg" alt="Participantes reunidas em ação institucional voltada às mulheres" loading="lazy"><figcaption>Atividade de valorização e integração das mulheres.</figcaption></figure><figure><img src="elas-atividade-02.jpeg" alt="Imagem ilustrativa de mulheres militares" loading="lazy"><figcaption>Imagem ilustrativa do protagonismo feminino no CBMERJ.</figcaption></figure></div></div></article>`;return}if(k==='0'){app.innerHTML=banner('Programa de Preparação para a Reserva (PPR)','Valorizando trajetórias, preparando novos caminhos')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="ppr-detail-cover" src="capa-ppr.png" alt="Logomarca do Programa de Preparação para a Reserva (PPR)"><h2>Programa de Preparação para a Reserva (PPR)</h2><p class="ppr-lead">Uma nova etapa da vida merece ser planejada.</p><p class="ppr-text">O Programa de Preparação para a Reserva (PPR), desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo apoiar os bombeiros militares na construção de uma transição consciente, planejada e qualificada para a reserva remunerada.</p><p class="ppr-text">Por meio de ações socioeducativas, atividades informativas e espaços de reflexão, o programa incentiva o planejamento pessoal e familiar, a autonomia, o fortalecimento dos vínculos sociais e a valorização de novas perspectivas de vida.</p><p class="ppr-text">Mais do que preparar para o encerramento de um ciclo profissional, o PPR busca contribuir para que cada bombeiro militar vivencie essa nova etapa com segurança, propósito, bem-estar e qualidade de vida.</p><p><strong>PPR — Valorizando trajetórias, preparando novos caminhos.</strong></p></div><div class="panel"><h2>Galeria de atividades do PPR</h2><p>Registros fotográficos de atividades com bombeiros militares.</p><div class="ppr-gallery"><figure><img src="ppr-atividade-01.jpeg" alt="Equipe do CBMERJ conduz atividade do PPR em auditório com participantes" loading="lazy"><figcaption>Atividade de apresentação e diálogo com participantes.</figcaption></figure><figure><img src="ppr-atividade-02.jpeg" alt="Bombeiros militares acompanham apresentação do PPR em sala de instrução" loading="lazy"><figcaption>Encontro informativo com bombeiros militares.</figcaption></figure></div></div></article>`;return}if(k==='2'){app.innerHTML=banner('Programa de Atenção à Pessoa com Deficiência (PAPcD)','Acolhendo famílias, fortalecendo direitos e promovendo inclusão')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="papcd-detail-cover" src="capa-papcd.jpeg" alt="Logomarca do Programa de Atenção à Pessoa com Deficiência"><h2>Programa de Atenção à Pessoa com Deficiência (PAPcD)</h2><p class="ppr-lead">Acolher famílias, promover direitos e fortalecer a inclusão.</p><p class="ppr-text">O Programa de Atenção à Pessoa com Deficiência (PAPcD), desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como finalidade acolher, orientar e apoiar bombeiros militares da ativa e veteranos que sejam responsáveis por pessoas com deficiência (PcD).</p><p class="ppr-text">Por meio de ações socioeducativas, atividades de orientação e iniciativas de sensibilização, o programa busca ampliar o acesso à informação sobre direitos e serviços, fortalecer as redes de apoio e contribuir para o enfrentamento das barreiras e dos desafios vivenciados pelas pessoas com deficiência e suas famílias.</p><p class="ppr-text">O PAPcD também promove a conscientização institucional e social sobre a importância da acessibilidade, do respeito às diferenças e da construção de ambientes mais inclusivos, valorizando a dignidade, a autonomia e a participação social.</p><p class="ppr-text">Mais do que oferecer orientação, o programa reafirma o compromisso da DGAS com o cuidado às famílias bombeiro-militares, a garantia de direitos e a promoção de uma cultura de inclusão.</p><p><strong>PAPcD — Acolhendo famílias, fortalecendo direitos e promovendo inclusão.</strong></p></div><div class="panel"><h2>Galeria de atividades do PAPcD</h2><p>Registros de atividades de aproximação e inclusão realizadas em unidades do CBMERJ.</p><div class="ppr-gallery"><figure><img src="papcd-petropolis.jpeg" alt="Bombeiro militar e crianças participam de atividade de aproximação com equipamento de combate a incêndio" loading="lazy"><figcaption>Atividade em Petrópolis.</figcaption></figure><figure><img src="papcd-araruama.jpeg" alt="Bombeiro militar interage com participante e familiares durante atividade ao ar livre" loading="lazy"><figcaption>Atividade em Araruama.</figcaption></figure></div></div></article>`;return}if(k==='3'){app.innerHTML=banner('Programa de Valorização da Vida (PVV)','Valorizar a vida é cuidar de quem cuida')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="pv-detail-cover" src="capa-pvv.png" alt="Logomarca do Programa de Valorização da Vida (PVV)"><h2>Programa de Valorização da Vida (PVV)</h2><p class="ppr-lead">Cuidar de quem protege vidas também é nossa missão.</p><p class="ppr-text">O Programa de Valorização da Vida (PVV), desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como propósito promover a saúde integral, o bem-estar emocional e a qualidade de vida dos bombeiros militares da ativa, veteranos e seus dependentes.</p><p class="ppr-text">Por meio de ações educativas, preventivas, atividades de sensibilização e iniciativas de acolhimento, o programa busca contribuir para a prevenção do sofrimento psíquico, a identificação precoce de sinais de adoecimento emocional e o fortalecimento das redes de apoio pessoal, familiar e institucional.</p><p class="ppr-text">O PVV também atua na conscientização sobre a importância da saúde mental, na prevenção do suicídio e no enfrentamento do preconceito relacionado à busca por ajuda, incentivando o diálogo, a escuta qualificada e o acesso aos serviços de cuidado.</p><p class="ppr-text">Ao valorizar a vida em todas as suas dimensões, o programa reafirma o compromisso da DGAS com uma cultura institucional de respeito, solidariedade, prevenção e cuidado contínuo.</p><p><strong>PVV — Valorizar a vida é cuidar de quem cuida.</strong></p></div><div class="panel"><h2>Galeria de atividades do PVV</h2><p>Registros de ações educativas, preventivas e de valorização da vida.</p><div class="ppr-gallery"><figure><img src="pvv-atividade-01.jpeg" alt="Material de conscientização sobre prevenção do suicídio durante atividade com bombeiros militares" loading="lazy"><figcaption>Ação de conscientização e prevenção.</figcaption></figure><figure><img src="pvv-atividade-02.jpeg" alt="Integrantes do CBMERJ e convidados durante encontro institucional de valorização da vida" loading="lazy"><figcaption>Encontro institucional e fortalecimento da rede de apoio.</figcaption></figure></div></div></article>`;return}if(k==='5'){app.innerHTML=banner('Projeto AproxiMar','Aproximando o cuidado de quem salva vidas')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="aprox-detail-cover" src="capa-aproximar.jpeg" alt="Identidade visual do Projeto AproxiMar"><h2>Projeto AproxiMar</h2><p class="ppr-lead">A assistência social mais próxima de quem protege nossas praias.</p><p class="ppr-text">O Projeto AproxiMar, desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo ampliar o acesso dos bombeiros militares guarda-vidas aos serviços socioassistenciais da Corporação, aproximando o atendimento das unidades e dos locais onde esses profissionais desempenham suas atividades.</p><p class="ppr-text">Por meio de ações itinerantes, acolhimento, escuta qualificada, orientação e acompanhamento social, o projeto busca identificar necessidades individuais e coletivas, oferecer suporte diante de situações de vulnerabilidade e facilitar o acesso à rede de proteção e aos serviços institucionais.</p><p class="ppr-text">Considerando as particularidades da rotina operacional dos guarda-vidas, o AproxiMar desenvolve estratégias de intervenção social alinhadas às demandas desses militares, contribuindo para o fortalecimento dos vínculos institucionais, a valorização profissional e a promoção do bem-estar e da qualidade de vida.</p><p class="ppr-text">Mais do que levar serviços aos postos de trabalho, o projeto reafirma o compromisso da DGAS com uma assistência social acessível, humanizada e presente no cotidiano dos bombeiros militares.</p><p><strong>AproxiMar — Aproximando o cuidado de quem salva vidas.</strong></p></div><div class="panel"><h2>Galeria de atividades do AproxiMar</h2><div class="ppr-gallery"><figure><img src="aproximar-atividade-01.jpeg" alt="Equipe de guarda-vidas e representante em atividade do Projeto AproxiMar na praia" loading="lazy"><figcaption>Atividade de aproximação e acompanhamento junto aos guarda-vidas.</figcaption></figure><figure><img src="aproximar-atividade-02.jpeg" alt="Equipe de guarda-vidas e representantes em frente a um posto de salvamento" loading="lazy"><figcaption>Visita institucional a posto de guarda-vidas.</figcaption></figure></div></div></article>`;return}if(k==='4'){app.innerHTML=banner('Projeto Resgatando Memórias','Valorizando histórias, preservando legados')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="mem-detail-cover" src="capa-resgatando-memorias.png" alt="Identidade visual do Projeto Resgatando Memórias"><h2>Projeto Resgatando Memórias</h2><p class="ppr-lead">Cada trajetória tem uma história. Cada história faz parte do CBMERJ.</p><p class="ppr-text">O Projeto Resgatando Memórias, desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo reconhecer e valorizar os bombeiros militares veteranos, preservando suas vivências, experiências e contribuições para a história da Corporação.</p><p class="ppr-text">Por meio de oficinas, rodas de conversa e encontros de convivência, o projeto proporciona espaços de escuta, interação e troca de experiências, estimulando o resgate das memórias individuais e coletivas e o fortalecimento dos vínculos entre os participantes.</p><p class="ppr-text">Ao compartilhar relatos de vida e experiências profissionais, os veteranos contribuem para manter viva a memória institucional, transmitir conhecimentos às novas gerações e reforçar o sentimento de pertencimento à família bombeiro-militar.</p><p class="ppr-text">Mais do que recordar o passado, o Resgatando Memórias celebra trajetórias, promove o convívio social e reconhece aqueles que ajudaram a construir a identidade e os valores do CBMERJ.</p><p><strong>Resgatando Memórias — Histórias que permanecem, legados que inspiram.</strong></p></div><div class="panel"><h2>Galeria de atividades</h2><p>Registros de encontros, rodas de conversa e momentos de valorização dos bombeiros militares veteranos.</p><div class="ppr-gallery"><figure><img src="memorias-atividade-01.jpeg" alt="Participantes reunidos durante atividade do Projeto Resgatando Memórias" loading="lazy"><figcaption>Encontro de valorização e convivência entre veteranos.</figcaption></figure><figure><img src="memorias-atividade-02.jpeg" alt="Roda de conversa com veteranos no Projeto Resgatando Memórias" loading="lazy"><figcaption>Troca de experiências e preservação da memória institucional.</figcaption></figure></div></div></article>`;return}if(k==='6'){app.innerHTML=banner('Projeto Educação Financeira','Conhecimento para decidir, planejamento para prosperar')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="fin-detail-cover" src="capa-educacao-financeira.jpeg" alt="Logomarca do Projeto Educação Financeira"><h2>Projeto Educação Financeira</h2><p class="ppr-lead">Planejar hoje é construir um futuro com mais segurança e tranquilidade.</p><p class="ppr-text">O Projeto Educação Financeira, desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo promover a conscientização e o desenvolvimento de conhecimentos e habilidades que contribuam para uma gestão financeira responsável, equilibrada e sustentável por parte dos bombeiros militares e de seus familiares.</p><p class="ppr-text">Por meio de palestras, atividades educativas e orientações práticas, o projeto aborda temas relacionados ao planejamento do orçamento familiar, à organização das despesas, ao consumo consciente, à prevenção do endividamento e à construção de reservas financeiras.</p><p class="ppr-text">A iniciativa busca estimular a autonomia na tomada de decisões, incentivar hábitos financeiros saudáveis e oferecer ferramentas que auxiliem os participantes a lidar com os desafios econômicos do cotidiano e a planejar seus objetivos de curto, médio e longo prazo.</p><p class="ppr-text">Ao reconhecer a importância da estabilidade financeira para o bem-estar individual e familiar, o projeto contribui para a redução de situações de vulnerabilidade, a promoção da qualidade de vida e o fortalecimento da segurança financeira da família bombeiro-militar.</p><p><strong>Educação Financeira — Conhecimento para decidir, planejamento para prosperar.</strong></p></div><div class="panel"><h2>Galeria de atividades de Educação Financeira</h2><div class="ppr-gallery"><figure><img src="financeira-atividade-01.jpeg" alt="Atividade educativa de planejamento financeiro com participantes do CBMERJ" loading="lazy"><figcaption>Orientação e conscientização sobre planejamento financeiro.</figcaption></figure><figure><img src="financeira-atividade-02.jpeg" alt="Participantes de ação de educação financeira no CBMERJ" loading="lazy"><figcaption>Encontro educativo para fortalecimento da autonomia financeira.</figcaption></figure></div></div></article>`;return}if(k==='7'){app.innerHTML=banner('Projeto Conversando com a Tropa','A informação aproxima, o diálogo fortalece')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="tropa-detail-cover" src="capa-conversando-tropa.jpeg" alt="Identidade visual do Projeto Conversando com a Tropa"><h2>Projeto Conversando com a Tropa</h2><p class="ppr-lead">Diálogo, orientação e cuidado presentes na rotina do bombeiro militar.</p><p class="ppr-text">O Projeto Conversando com a Tropa, desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo aproximar os serviços socioassistenciais dos bombeiros militares, promovendo espaços coletivos de diálogo, orientação e troca de conhecimentos sobre temas relevantes para a vida pessoal, familiar e profissional.</p><p class="ppr-text">A iniciativa aborda assuntos relacionados aos direitos sociais, ao bem-estar, à qualidade de vida e ao acesso aos serviços e programas de assistência social, contribuindo para ampliar a informação, identificar demandas e fortalecer os vínculos entre a DGAS e a tropa.</p><p class="ppr-text">As atividades são realizadas diretamente nas unidades operacionais e administrativas, durante o expediente, aproveitando momentos oportunos da rotina militar, como passagens de serviço, formaturas e hasteamentos da bandeira, sem prejuízo das atividades institucionais.</p><p class="ppr-text">Por meio de uma abordagem acessível, participativa e humanizada, o projeto estimula a reflexão, a escuta e a construção coletiva de conhecimentos, valorizando as experiências dos militares e incentivando o cuidado individual e coletivo.</p><p><strong>Conversando com a Tropa — A informação aproxima, o diálogo fortalece.</strong></p></div><div class="panel"><h2>Galeria de atividades</h2><div class="gallery"><figure><img src="tropa-atividade-01.jpeg" alt="Militares reunidos em formatura na unidade" loading="lazy"><figcaption>Diálogo com a tropa durante atividade na unidade.</figcaption></figure><figure><img src="tropa-atividade-02.jpeg" alt="Apresentação e orientação socioassistencial para bombeiros militares" loading="lazy"><figcaption>Orientação e apresentação dos serviços da DGAS.</figcaption></figure></div></div></article>`;return}if(k==='8'){app.innerHTML=banner('Projeto Serviço Social Itinerante','Levando acolhimento, orientação e cuidado a cada unidade')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><img class="itinerante-detail-cover" src="capa-servico-social-itinerante.jpeg" alt="Identidade visual do Projeto Serviço Social Itinerante"><h2>Projeto Serviço Social Itinerante</h2><p class="ppr-lead">A assistência social presente onde o bombeiro militar precisa.</p><p class="ppr-text">O Projeto Serviço Social Itinerante, desenvolvido pela Diretoria-Geral de Assistência Social do CBMERJ, tem como objetivo ampliar o acesso à assistência social, levando acolhimento, orientação e acompanhamento socioassistencial às Organizações de Bombeiros Militar (OBMs) que não dispõem de Polos Descentralizados de Serviço Social.</p><p class="ppr-text">Por meio de visitas técnicas e atendimentos realizados por oficiais assistentes sociais, o projeto aproxima os serviços da DGAS dos bombeiros militares da ativa, veteranos, seus dependentes e pensionistas, considerando as necessidades e particularidades de cada unidade.</p><p class="ppr-text">As ações compreendem escuta qualificada, identificação de demandas, orientação sobre direitos e benefícios, encaminhamentos à rede de atendimento e acompanhamento de situações que necessitem de intervenção socioassistencial.</p><p class="ppr-text">Ao superar barreiras geográficas e facilitar o acesso aos serviços institucionais, o projeto contribui para o fortalecimento dos vínculos entre a DGAS e a família bombeiro-militar, promovendo proteção social, cidadania e qualidade de vida.</p><p><strong>Serviço Social Itinerante — Levando acolhimento, orientação e cuidado a cada unidade.</strong></p></div><div class="panel"><h2>Galeria de atividades</h2><div class="gallery"><figure><img src="itinerante-atividade-01.jpeg" alt="Bombeiros militares reunidos em unidade operacional durante atividade institucional" loading="lazy"><figcaption>Presença institucional nas unidades operacionais.</figcaption></figure><figure><img src="itinerante-atividade-02.jpeg" alt="Oficial bombeiro militar realizando trabalho de orientação e acompanhamento em ambiente administrativo" loading="lazy"><figcaption>Atuação socioassistencial e orientação nas unidades.</figcaption></figure></div></div></article>`;return}app.innerHTML=banner(name,'Iniciativa da DGAS')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><h2>Apresentação</h2><p>Projeto identificado no portfólio institucional da DGAS. Descrição detalhada, atividades e resultados serão incorporados após revisão e validação.</p></div><div class="panel"><h2>Fotografias e informações</h2><p>Conteúdo institucional pendente de seleção e autorização para divulgação pública.</p></div></article>`;return}let labels={sobre:['Sobre a DGAS','Conheça a atuação institucional da Diretoria-Geral de Assistência Social'],servicos:['Serviços','Acolhimento, orientação e atendimento social'],acoes:['Ações','Campanhas, eventos e iniciativas'],resultados:['Resultados','Informações e indicadores institucionais']};const [name,desc]=labels[page]||labels.sobre;app.innerHTML=banner(name,desc)+`<section class="detail"><div class="panel"><h2>${name}</h2><p>Conteúdo em preparação. As informações oficiais serão publicadas após validação institucional.</p></div></section>`}
function drawCatalog(){const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();const q=norm(search.trim());const rows=polos.filter(p=>(!selectedRegion||p.region===selectedRegion)&&(!q||norm(p.name+' '+p.unit+' '+p.region).includes(q)));document.getElementById('count').textContent=rows.length+' polo'+(rows.length!==1?'s':'')+' encontrado'+(rows.length!==1?'s':'');document.getElementById('catalog').innerHTML=rows.length?rows.map(p=>`<button class="polocard" onclick="go('polo/${p.id}')"><div class="circle">${pin}</div><strong>${esc(p.name)}</strong><span class="unit">${esc(p.unit)}</span><span class="desc">${esc(p.region)}</span></button>`).join(''):`<div class="empty">Nenhum polo encontrado. Experimente outra pesquisa ou selecione todas as regiões.</div>`}

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal DGAS | CBMERJ</title><style>
:root{--wine:#7e1328;--deep:#26080f;--gold:#bf8d4a;--text:#202027;--muted:#56565c;--scale:1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:calc(19px * var(--scale))/1.5 'Segoe UI',Arial,sans-serif;color:var(--text);background:white}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #e7a632;outline-offset:3px}.topbar{background:#19070b;color:white;padding:9px max(22px,calc((100vw - 1460px)/2));font-size:.76em;text-align:right}.mainhead{background:linear-gradient(115deg,#27090f,#3d101c);color:white;padding:17px max(22px,calc((100vw - 1460px)/2));display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap}.identity{display:flex;align-items:center;gap:18px}.identity img{height:94px;width:94px;object-fit:contain}.identity strong{font-size:1.55em;letter-spacing:-.04em;display:block;line-height:1.1}.identity small{font-size:.75em;color:#e6d5d8}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:transparent;color:white;padding:13px 14px;font-size:1.04em;font-weight:700;border-radius:7px;min-height:55px}nav button:hover,nav button.active{background:#87213a}.tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px max(22px,calc((100vw - 1460px)/2));background:#f8f3f4;font-size:.8em}.tools button{background:white;border:1px solid #cbbcc0;padding:7px 12px;border-radius:6px;font-weight:750;min-height:43px}.tools button.selected{background:var(--wine);color:white}.hero{position:relative;line-height:0}.hero img{width:100%;height:auto;display:block}.hotspot{position:absolute;left:9.2%;top:37%;width:20%;height:9%;border:0;background:transparent;border-radius:12px}.hotspot:hover{background:#ffffff20}.hotspot:focus-visible{outline:5px solid #ffc84d}.intro{max-width:1400px;margin:auto;padding:54px 24px}.intro h2{font-size:1.7em;margin:0 0 20px}.featuregrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.feature{border:1px solid #e7dfe1;background:white;border-radius:12px;padding:28px;text-align:left;min-height:155px;box-shadow:0 10px 28px #230b1010}.feature strong{display:block;font-size:1.12em;color:#681123}.feature span{color:var(--muted);font-size:.9em}.pagebanner{background:linear-gradient(105deg,#2c0913,#79172b 65%,#a32c3c);color:white;text-align:center;padding:35px 20px 44px}.crumb{font-size:.8em;font-weight:650;letter-spacing:.06em}.pagebanner h1{font-size:clamp(34px,3.6vw,55px);margin:8px 0;line-height:1.2}.pagebanner p{margin:0}.layout{max-width:1490px;margin:0 auto;display:grid;grid-template-columns:255px minmax(0,1fr);gap:48px;padding:46px 24px 80px}.sidebar h2{font-size:1.05em;margin:0 0 10px;border-bottom:1px solid #ddd;padding-bottom:12px}.sidebar label{display:flex;align-items:flex-start;gap:10px;padding:11px 4px;font-size:.86em;cursor:pointer}.sidebar input{accent-color:var(--wine);width:20px;height:20px;flex:none;margin-top:3px}.sidebar .filterlabel{font-weight:800;margin-top:18px}.searchrow{display:flex;gap:10px;border-bottom:1px solid #e7e7e7;padding-bottom:16px;margin-bottom:26px}.searchrow input{width:100%;max-width:420px;border:1px solid #bbb;border-radius:6px;padding:12px 14px;min-height:53px}.searchrow button,.primary{border:0;border-radius:7px;background:#81172c;color:white;font-weight:750;padding:12px 23px;min-height:53px}.searchrow button:hover,.primary:hover{background:#5c1020}.count{color:#6a2432;font-weight:750;margin-bottom:22px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:30px;row-gap:50px}.polocard{border:0;background:transparent;text-align:left;padding:0 4px 10px;color:inherit;min-width:0}.circle{width:min(100%,225px);aspect-ratio:1;margin:0 auto 17px;border:5px solid #d4d4d4;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#f9f4f4,#e9dfe2);position:relative;overflow:hidden;transition:border-color .15s,transform .15s}.circle:before{content:'';position:absolute;inset:12%;border:2px solid #c9a7af;border-radius:50%}.circle svg{width:40%;height:40%;stroke:#8b1d35;stroke-width:1.8;fill:none;z-index:1}.polocard:hover .circle,.polocard:focus-visible .circle{border-color:var(--wine);transform:translateY(-3px)}.polocard strong{display:block;font-size:1.18em;font-weight:850;line-height:1.25;margin-bottom:9px}.polocard .unit{font-weight:700;color:#81182e}.polocard .desc{font-size:.85em;color:#5c5c62;line-height:1.4;display:block;margin-top:6px}.detail{max-width:1050px;margin:45px auto 80px;padding:0 24px}.back{background:#f4e5e8;color:#711528;border:0;border-radius:8px;padding:12px 18px;font-weight:750;margin-bottom:25px}.panel{border:1px solid #e5d9dd;border-radius:13px;padding:30px;margin:18px 0;background:#fff}.panel h2{margin-top:0;color:#75172c}.notice{font-size:.85em;color:#555}.tag{display:inline-block;background:#f5e4e8;color:#7b172b;border-radius:99px;padding:6px 15px;font-size:.82em;font-weight:700}.empty{padding:25px;background:#f9f1f3;border-radius:9px}.projectgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.projectcard{border:1px solid #e0d5d8;border-radius:12px;background:white;text-align:left;padding:22px;min-height:190px}.projectcard strong{font-size:1.1em;display:block;margin-top:15px}.projectcard .circle{width:110px;margin:0 auto}.footer{background:#220a11;color:#eee;text-align:center;padding:36px 18px;font-size:.78em}@media(max-width:1150px){.mainhead{justify-content:center}.layout{grid-template-columns:220px 1fr;gap:22px}.catalog{gap:22px}.featuregrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.identity img{height:75px;width:75px}.identity strong{font-size:1.25em}nav{width:100%;justify-content:center}nav button{font-size:.9em;padding:9px}.layout{display:block;padding:24px 18px 50px}.sidebar{border:1px solid #e6dfe1;border-radius:10px;padding:16px;margin-bottom:25px}.catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.circle{width:min(100%,175px)}.featuregrid,.projectgrid{grid-template-columns:1fr}.pagebanner{padding:26px 15px}.hero{overflow:hidden}.hotspot{left:9%;top:37%;width:23%;height:10%}}@media(max-width:420px){.catalog{grid-template-columns:1fr}.circle{width:220px}}
</style></head><body><div class="topbar">CBMERJ · Diretoria-Geral de Assistência Social</div><header class="mainhead"><div class="identity"><img alt="Logomarca DGAS" src="logo-dgas.png"><div><strong>PORTAL DGAS</strong><small>CBMERJ · Diretoria-Geral de Assistência Social</small></div></div><nav aria-label="Navegação principal"><button data-page="inicio">Início</button><button data-page="sobre">Sobre</button><button data-page="polos">Polos</button><button data-page="projetos">Projetos</button><button data-page="servicos">Serviços</button><button data-page="acoes">Ações</button><button data-page="resultados">Resultados</button></nav></header><div class="tools"><span>Tamanho do texto:</span><button data-scale="1" class="selected">100%</button><button data-scale="1.25">125%</button><button data-scale="1.5">150%</button></div><main id="app"></main><footer class="footer">Portal DGAS · CBMERJ · Protótipo institucional — informações de atendimento sujeitas à validação antes da publicação pública</footer><script>
const polos=[{"name": "Humaitá", "unit": "1º GBM", "region": "Capital e Especializado", "id": "p0_0"}, {"name": "Méier", "unit": "2º GBM", "region": "Capital e Especializado", "id": "p0_1"}, {"name": "Campo Grande", "unit": "13º GBM", "region": "Capital e Especializado", "id": "p0_2"}, {"name": "Barra da Tijuca", "unit": "2º GMAR", "region": "Capital e Especializado", "id": "p0_3"}, {"name": "Copacabana", "unit": "3º GMAR", "region": "Capital e Especializado", "id": "p0_4"}, {"name": "Veteranos e Pensionistas", "unit": "Sede da DGVP", "region": "Capital e Especializado", "id": "p0_5"}, {"name": "Niterói", "unit": "3º GBM", "region": "Metropolitano", "id": "p1_0"}, {"name": "São Gonçalo", "unit": "20º GBM", "region": "Metropolitano", "id": "p1_1"}, {"name": "Itaipu", "unit": "DBM 4/3", "region": "Metropolitano", "id": "p1_2"}, {"name": "Nova Iguaçu", "unit": "4º GBM", "region": "Baixada Fluminense e Região Serrana", "id": "p2_0"}, {"name": "Duque de Caxias", "unit": "14º GBM", "region": "Baixada Fluminense e Região Serrana", "id": "p2_1"}, {"name": "Petrópolis", "unit": "15º GBM", "region": "Baixada Fluminense e Região Serrana", "id": "p2_2"}, {"name": "Nova Friburgo", "unit": "6º GBM", "region": "Baixada Fluminense e Região Serrana", "id": "p2_3"}, {"name": "Barra Mansa", "unit": "7º GBM", "region": "Sul Fluminense e Costa Verde", "id": "p3_0"}, {"name": "Angra dos Reis", "unit": "10º GBM", "region": "Sul Fluminense e Costa Verde", "id": "p3_1"}, {"name": "Volta Redonda", "unit": "22º GBM", "region": "Sul Fluminense e Costa Verde", "id": "p3_2"}, {"name": "Cabo Frio", "unit": "18º GBM", "region": "Baixada Litorânea", "id": "p4_0"}, {"name": "Macaé", "unit": "9º GBM", "region": "Baixada Litorânea", "id": "p4_1"}, {"name": "Araruama", "unit": "27º GBM", "region": "Baixada Litorânea", "id": "p4_2"}, {"name": "Campos dos Goytacazes", "unit": "5º GBM", "region": "Norte e Noroeste Fluminense", "id": "p5_0"}, {"name": "Itaperuna", "unit": "21º GBM", "region": "Norte e Noroeste Fluminense", "id": "p5_1"}, {"name": "São Fidélis", "unit": "DBM 2/5", "region": "Norte e Noroeste Fluminense", "id": "p5_2"}],regions=["Capital e Especializado", "Metropolitano", "Baixada Fluminense e Região Serrana", "Sul Fluminense e Costa Verde", "Baixada Litorânea", "Norte e Noroeste Fluminense"],projects=["Preparação para Reserva (PPR)", "Prevenção à Violência Contra a Mulher (PPV)", "Atenção à Pessoa com Deficiência", "Valorização da Vida (PVV)", "Resgatando Memórias", "AproxiMar", "Educação Financeira", "Conversando com a Tropa"];
const app=document.getElementById('app');let page='inicio',selectedRegion='',search='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pin=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 57s20-19 20-34a20 20 0 0 0-40 0c0 15 20 34 20 34Z"/><circle cx="32" cy="23" r="8"/></svg>`;
function go(p){page=p;search='';selectedRegion='';render();window.scrollTo({top:0,behavior:'instant'})}window.go=go;
function banner(title,desc){return `<section class="pagebanner"><div class="crumb">PÁGINA INICIAL / ${esc(title.toUpperCase())}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='inicio'){app.innerHTML=`<section class="hero"><img alt="Capa DGAS com mapa em malha do Estado do Rio de Janeiro" src="capa-dgas.png"><button class="hotspot" aria-label="Conheça nossos polos" title="Conheça nossos polos" onclick="go('polos')"></button></section><section class="intro"><h2>Conheça a DGAS</h2><div class="featuregrid">${[['Nossos polos','22 polos fixos em seis núcleos regionais','polos'],['Projetos e programas','Iniciativas de assistência social','projetos'],['Serviços','Acolhimento e orientação','servicos'],['Ações e resultados','Atividades institucionais','acoes']].map(a=>`<button class="feature" onclick="go('${a[2]}')"><strong>${a[0]} →</strong><span>${a[1]}</span></button>`).join('')}</div></section>`;return}if(page==='polos'){app.innerHTML=banner('Nossos polos','22 polos fixos distribuídos em seis núcleos regionais do Estado do Rio de Janeiro')+`<div class="layout"><aside class="sidebar"><h2>⚲ FILTROS</h2><div class="filterlabel">Núcleos regionais</div><label><input type="radio" name="reg" value="" checked> Todas as regiões</label>${regions.map(r=>`<label><input type="radio" name="reg" value="${esc(r)}"> ${esc(r)}</label>`).join('')}</aside><section><div class="searchrow"><input id="search" type="search" placeholder="Pesquise por polo ou município" aria-label="Pesquisar polo ou município"><button id="searchbtn">Buscar</button></div><div id="count" class="count" aria-live="polite"></div><div id="catalog" class="catalog"></div></section></div>`;document.querySelectorAll('input[name=reg]').forEach(e=>e.addEventListener('change',()=>{selectedRegion=e.value;drawCatalog()}));document.getElementById('search').addEventListener('input',e=>{search=e.target.value;drawCatalog()});document.getElementById('searchbtn').addEventListener('click',()=>drawCatalog());drawCatalog();return}if(page.startsWith('polo/')){const p=polos.find(x=>x.id===page.slice(5));if(!p)return go('polos');app.innerHTML=banner(p.name,p.region)+`<article class="detail"><button class="back" onclick="go('polos')">← Voltar aos polos</button><div class="panel"><span class="tag">Polo fixo</span><h2>${esc(p.name)}</h2><p><strong>Unidade de referência:</strong> ${esc(p.unit)}</p><p><strong>Núcleo regional:</strong> ${esc(p.region)}</p></div><div class="panel"><h2>Atendimento e localização</h2><p>Endereço, telefone, horários de atendimento e fotografias aguardam confirmação institucional.</p></div><div class="panel"><h2>Serviços e projetos vinculados</h2><p>Informações a serem preenchidas após validação do portfólio e da atuação local.</p><button class="primary" onclick="go('projetos')">Conheça os projetos</button></div></article>`;return}if(page==='projetos'){app.innerHTML=banner('Projetos e programas','Conheça as iniciativas da Diretoria-Geral de Assistência Social')+`<section class="intro"><h2>Programas estruturantes</h2><div class="featuregrid"><button class="feature" onclick="go('projeto/qualidade')"><strong>Qualidade de Vida do Bombeiro Militar</strong><span>Programa institucional</span></button><button class="feature" onclick="go('projeto/descentralizacao')"><strong>Descentralização do Serviço Social</strong><span>Programa institucional</span></button></div><h2 style="margin-top:50px">Projetos</h2><div class="projectgrid">${projects.map((p,i)=>`<button class="projectcard" onclick="go('projeto/${i}')"><div class="circle">${pin}</div><strong>${esc(p)}</strong><span class="notice">Conheça a iniciativa →</span></button>`).join('')}</div></section>`;return}if(page.startsWith('projeto/')){const k=page.split('/')[1],name=k==='qualidade'?'Qualidade de Vida do Bombeiro Militar':k==='descentralizacao'?'Descentralização do Serviço Social':projects[Number(k)]||'Projeto';app.innerHTML=banner(name,'Iniciativa da DGAS')+`<article class="detail"><button class="back" onclick="go('projetos')">← Voltar aos projetos</button><div class="panel"><h2>Apresentação</h2><p>Projeto identificado no portfólio institucional da DGAS. Descrição detalhada, atividades e resultados serão incorporados após revisão e validação.</p></div><div class="panel"><h2>Fotografias e informações</h2><p>Conteúdo institucional pendente de seleção e autorização para divulgação pública.</p></div></article>`;return}let labels={sobre:['Sobre a DGAS','Conheça a atuação institucional da Diretoria-Geral de Assistência Social'],servicos:['Serviços','Acolhimento, orientação e atendimento social'],acoes:['Ações','Campanhas, eventos e iniciativas'],resultados:['Resultados','Informações e indicadores institucionais']};const [name,desc]=labels[page]||labels.sobre;app.innerHTML=banner(name,desc)+`<section class="detail"><div class="panel"><h2>${name}</h2><p>Conteúdo em preparação. As informações oficiais serão publicadas após validação institucional.</p></div></section>`}
function drawCatalog(){const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();const q=norm(search.trim());const rows=polos.filter(p=>(!selectedRegion||p.region===selectedRegion)&&(!q||norm(p.name+' '+p.unit+' '+p.region).includes(q)));document.getElementById('count').textContent=rows.length+' polo'+(rows.length!==1?'s':'')+' encontrado'+(rows.length!==1?'s':'');document.getElementById('catalog').innerHTML=rows.length?rows.map(p=>`<button class="polocard" onclick="go('polo/${p.id}')"><div class="circle">${pin}</div><strong>${esc(p.name)}</strong><span class="unit">${esc(p.unit)}</span><span class="desc">${esc(p.region)}</span></button>`).join(''):`<div class="empty">Nenhum polo encontrado. Experimente outra pesquisa ou selecione todas as regiões.</div>`}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.querySelectorAll('[data-scale]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--scale',b.dataset.scale);document.querySelectorAll('[data-scale]').forEach(x=>x.classList.toggle('selected',x===b))}));render();
</script></body></html>
